apiVersion: apps/v1
kind: Deployment
metadata:
  name: goof
  namespace: goof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goof
  template:
    metadata:
      labels:
        app: goof
    spec:
      containers:
        - name: goof
          image: nodejs-goof:k8s
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DOCKER
              value: "1"
            - name: HOME
              value: /tmp
            - name: MONGODB_URI
              value: "mongodb://192.168.136.132:27017/express-todo"
            - name: MYSQL_HOST
              value: "192.168.136.132"
            - name: MYSQL_PORT
              value: "3306"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: goof
  namespace: goof
spec:
  type: ClusterIP
  selector:
    app: goof
  ports:
    - port: 80
      targetPort: 3001
