apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goof
  namespace: goof
spec:
  ingressClassName: traefik
  rules:
    - host: goof.snyk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goof
                port:
                  number: 80
